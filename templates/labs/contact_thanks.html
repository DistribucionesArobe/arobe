{% extends "labs/_base.html" %}

    <div class="w-16 h-16 bg-labs-600 text-white grid place-items-center font-black text-2xl rounded-full mx-auto">✓</div>
    <h1 class="text-3xl md:text-4xl font-extrabold mt-6 text-slate-900">Thanks, {{ name or 'partner' }}.</h1>

</section>
